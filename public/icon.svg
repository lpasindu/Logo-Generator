<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gold-radial" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Cog / Starburst Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#gold-radial)" filter="url(#gold-glow)" stroke="#fef08a" stroke-width="6"/>

  <!-- Beaded Inner Rim -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#78350f" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="202" fill="#020617"/>

  <!-- Dark Inner Seal -->
  <circle cx="256" cy="256" r="180" fill="url(#inner-grad)" stroke="#f59e0b" stroke-width="4"/>

  <!-- Center Globe / Shield Emblem -->
  <g fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="110"/>
    <ellipse cx="256" cy="256" rx="55" ry="110"/>
    <line x1="146" y1="256" x2="366" y2="256"/>
    <line x1="166" y1="200" x2="346" y2="200"/>
    <line x1="166" y1="312" x2="346" y2="312"/>
  </g>

  <!-- Star Accents -->
  <path d="M 256 95 L 261 108 L 275 109 L 264 118 L 268 131 L 256 123 L 244 131 L 248 118 L 237 109 L 251 108 Z" fill="#fef08a"/>
  <path d="M 256 385 L 261 398 L 275 399 L 264 408 L 268 421 L 256 413 L 244 421 L 248 408 L 237 399 L 251 398 Z" fill="#fef08a"/>
</svg>
